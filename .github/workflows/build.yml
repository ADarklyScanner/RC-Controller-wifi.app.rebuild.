name: Build APK

on:
  push:
    branches: [main]
  pull_request:          # build only, to check it compiles; nothing is released
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Copy the shared screen into the app
        env:
          # optional: a custom font kept out of the public code (repo secrets, base64 of each .ttf)
          FONT_400_B64: ${{ secrets.FONT_400_B64 }}
          FONT_700_B64: ${{ secrets.FONT_700_B64 }}
        run: python3 tools/extract_assets.py

      - name: Build
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log || {
            # surface the errors as annotations (readable from the run summary)
            { grep -E '^e: ' build.log | head -25; grep -A12 'What went wrong' build.log | head -30; } > err.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' err.txt)
            echo "::error title=Build failed::$msg"
            exit 1; }

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk FPV-Car.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FPV-Car
          path: FPV-Car.apk

      - name: Replace the previous release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag -y -R "${{ github.repository }}" || true

      - name: Publish as the latest download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FPV Car (latest build)
          body: "Install FPV-Car.apk on the phone. Build ${{ github.run_number }} from ${{ github.sha }}."
          files: FPV-Car.apk
          make_latest: true
